name: Good first issue
description: A scoped task for a new contributor
title: "good first issue: "
labels: []
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: One behavior, the files it likely touches, and how to tell it is done.
    validations:
      required: true
  - type: textarea
    id: hints
    attributes:
      label: Hints
      description: Point at an existing test or fixture the change can follow.
    validations:
      required: false
